<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Admin Console — DeepakMart</title><link rel="stylesheet" href="/css/styles.css"></head>
<body data-page="admin"><div id="siteHeader"></div><main class="container section dashboard-page"><div class="dashboard-hero admin-hero"><div><span class="eyebrow">ADMIN CONSOLE</span><h1>Keep the marketplace healthy.</h1><p>Review users, orders and remove listings when required.</p></div><div class="dashboard-badge">ADMIN</div></div><div class="dashboard-stats"><div><span>Total users</span><strong id="adminUserCount">0</strong></div><div><span>Total orders</span><strong id="adminOrderCount">0</strong></div><div><span>Listings</span><strong id="adminProductCount">0</strong></div></div><section class="dashboard-panel table-panel"><div class="card-heading"><div><span class="eyebrow">USERS</span><h2>All users</h2></div><button id="refreshAdminUsers" class="icon-button">↻</button></div><div class="table-wrap"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created</th></tr></thead><tbody id="adminUsers"></tbody></table></div></section><section class="dashboard-panel"><div class="card-heading"><div><span class="eyebrow">LISTINGS</span><h2>Product moderation</h2></div><button id="refreshAdminProducts" class="icon-button">↻</button></div><div id="adminProducts" class="admin-products"></div></section><section class="dashboard-panel"><div class="card-heading"><div><span class="eyebrow">ORDERS</span><h2>All orders</h2></div><button id="refreshAdminOrders" class="icon-button">↻</button></div><div id="adminOrders" class="admin-orders"></div></section></main><div id="siteFooter"></div><div id="toast"></div><script src="/js/app.js"></script></body></html>
