<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Checkout — DeepakMart</title><link rel="stylesheet" href="/css/styles.css"></head>
<body data-page="checkout"><div id="siteHeader"></div><main class="container section checkout-page"><div class="page-intro"><span class="eyebrow">SECURE CHECKOUT</span><h1>Complete your order.</h1><p>Your details are kept ready for the next visit on this device.</p></div><div class="checkout-layout"><section class="checkout-main"><div class="checkout-card"><div class="card-heading"><div><span class="eyebrow">1 / 3</span><h2>Delivery details</h2></div></div><form id="addressForm" class="form-grid"><label>Full name<input id="checkoutName" required></label><label>Phone<input id="checkoutPhone" required></label><label class="full">Address<textarea id="checkoutAddress" rows="3" required></textarea></label><label>City<input id="checkoutCity" required></label><label>PIN code<input id="checkoutPin" required></label></form></div><div class="checkout-card"><div class="card-heading"><div><span class="eyebrow">2 / 3</span><h2>Payment method</h2></div></div><div class="payment-options"><button type="button" class="payment-option active" data-method="cod"><span>▣</span><div><strong>Cash on Delivery</strong><small>Pay when your order arrives</small></div><i>✓</i></button><button type="button" class="payment-option" data-method="upi"><span>⌁</span><div><strong>UPI</strong><small>Use the demo QR for payment confirmation</small></div><i>✓</i></button></div><div id="upiBox" class="upi-box hidden"><div class="qr-box" aria-label="Demo UPI QR"><div class="qr-pattern"></div></div><div><strong>Scan to pay</strong><p>Demo UPI ID: <b>deepakmart@demo</b></p><small>This is a mock payment step for the academic project.</small></div></div></div><div class="checkout-card"><div class="card-heading"><div><span class="eyebrow">3 / 3</span><h2>Confirm & place order</h2></div></div><div id="checkoutConfirm"></div><button class="btn btn-primary btn-large full" id="placeOrder">Confirm & place order →</button></div></section><aside class="summary-card" id="checkoutSummary"></aside></div></main><div id="siteFooter"></div><div id="toast"></div><script src="/js/app.js"></script></body></html>
