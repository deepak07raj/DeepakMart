<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Seller Studio — DeepakMart</title><link rel="stylesheet" href="/css/styles.css"></head>
<body data-page="seller"><div id="siteHeader"></div><main class="container section dashboard-page"><div class="dashboard-hero seller-hero"><div><span class="eyebrow">SELLER STUDIO</span><h1>Run your storefront.</h1><p>Create listings, edit stock and see incoming orders.</p></div><div class="dashboard-badge">SELLER</div></div><div class="dashboard-stats"><div><span>My listings</span><strong id="sellerProductCount">0</strong></div><div><span>Incoming orders</span><strong id="sellerOrderCount">0</strong></div><div><span>Store status</span><strong>Live</strong></div></div><div class="dashboard-layout"><section class="dashboard-panel"><div class="card-heading"><div><span class="eyebrow">CATALOG</span><h2 id="sellerFormTitle">Add a product</h2></div></div><form id="sellerProductForm" class="form-grid"><input id="sellerProductId" type="hidden"><label class="full">Product name<input id="sellerName" required></label><label>Category<select id="sellerCategory"><option>Electronics</option><option>Fashion</option><option>Beauty</option><option>Home</option><option>Lifestyle</option><option>Sports</option><option>Toys & Kids</option></select></label><label>Price (₹)<input id="sellerPrice" type="number" min="0" step="0.01" required></label><label>Stock<input id="sellerStock" type="number" min="0" required></label><label class="full">Image URL<input id="sellerImage" placeholder="https://..."></label><label class="full">Description<textarea id="sellerDescription" rows="4"></textarea></label><div class="form-actions full"><button class="btn btn-primary" type="submit" id="sellerSaveBtn">Publish listing →</button><button class="btn btn-white" type="button" id="sellerCancelEdit">Clear</button></div></form></section><section class="dashboard-panel"><div class="card-heading"><div><span class="eyebrow">MY LISTINGS</span><h2>Products</h2></div><button id="refreshSellerProducts" class="icon-button">↻</button></div><div id="sellerProducts"></div></section></div><section class="dashboard-panel"><div class="card-heading"><div><span class="eyebrow">INCOMING ORDERS</span><h2>Recent orders</h2></div><button id="refreshSeller" class="icon-button">↻</button></div><div id="sellerOrders"></div></section></main><div id="siteFooter"></div><div id="toast"></div><script src="/js/app.js"></script></body></html>
